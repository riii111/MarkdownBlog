name: "Backend E2E Tests"

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "backend/**"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "backend/**"

jobs:
  test-backend:
    name: Run Backend E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          cd backend
          go mod download

      - name: Install testcontainers dependencies
        run: |
          # Dockerがすでにインストールされているため、追加のセットアップは不要
          # GitHub Actionsのubuntu-latestランナーにはDockerが事前インストールされている
          docker --version

      - name: Run E2E tests
        run: |
          cd backend
          chmod +x ./tests/run_tests.sh
          ./tests/run_tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: backend/target/test-logs
          retention-days: 7
